server {
    listen 80;
    server_name localhost;

    # API 请求转发 - /public/ecommerce/api/* -> server /api/*
    location /public/ecommerce/api/ {
        rewrite ^/public/ecommerce/api/(.*)$ /api/$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # GPT Interaction API 转发 - /public/ecommerce/gpt-api/* -> gpt-interaction /api/v1/*
    location /public/ecommerce/gpt-api/ {
        rewrite ^/public/ecommerce/gpt-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://gpt-interaction:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 长连接支持
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 前端页面转发 - /public/ecommerce/* -> web
    location /public/ecommerce {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查端点
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
