services:
  gpt-interaction:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: codedevin/gpt-interaction:20260114
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./user_data:/app/user_data
    shm_size: "2gb"
    depends_on:
      - db

  db:
    image: postgres:17  
    restart: always
    environment:
      POSTGRES_USER: gpt_interaction
      POSTGRES_PASSWORD: gpt_interaction
      POSTGRES_DB: gpt_interaction
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
