services:
  gpt-interaction:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BROWSER_USER_DATA_BASE_PATH: /app/user_data
      ENABLE_XVFB: "1"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: gpt_interaction
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./user_data:/app/user_data
    shm_size: "2gb"
    depends_on:
      - db

  db:
    image: postgres:17  
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gpt_interaction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
